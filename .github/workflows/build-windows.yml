
name: Build - Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/build-windows.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  build:
    name: windows-2022-release
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read vcpkg baseline
        id: vcpkg
        shell: pwsh
        run: |
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $commit = $json.'builtin-baseline'
          if ($commit -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid vcpkg baseline"
          }
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Install vcpkg
        uses: lukka/run-vcpkg@a400452f634fe49e9f18d388aeb1809dcc642136
        with:
          vcpkgGitCommitId: ${{ steps.vcpkg.outputs.commit }}

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v3.31.6

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake --preset windows-release -DOTCLIENT_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

      - name: Build CrystalOTC
        shell: pwsh
        run: |
          cmake --build --preset windows-release --parallel 2
          if ($LASTEXITCODE -ne 0) {
            throw "Compilation failed"
          }

      - name: Prepare complete client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:GITHUB_WORKSPACE
          $output = Join-Path $root "CrystalOTC-Windows"

          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $exe = Get-ChildItem (Join-Path $root "build") -Recurse -File -Filter "*.exe" |
            Where-Object {
              $_.Name -match '^(otclient|CrystalOTC).*\.exe$'
            } |
            Select-Object -First 1

          if (-not $exe) {
            throw "Client executable not found"
          }

          Copy-Item $exe.FullName (Join-Path $output "CrystalOTC.exe")

          Get-ChildItem $exe.DirectoryName -Filter "*.dll" -File |
            Copy-Item -Destination $output

          foreach ($folder in @("data", "modules", "mods")) {
            $source = Join-Path $root $folder
            if (-not (Test-Path $source)) {
              throw "Required folder missing: $folder"
            }
            Copy-Item $source $output -Recurse -Force
          }

          $init = Join-Path $root "init.lua"
          if (-not (Test-Path $init)) {
            throw "init.lua not found"
          }
          Copy-Item $init $output

          foreach ($folder in @("assets", "layouts")) {
            $source = Join-Path $root $folder
            if (Test-Path $source) {
              Copy-Item $source $output -Recurse -Force
            }
          }

          Write-Host "Client package prepared successfully"

      - name: Upload CrystalOTC package
        uses: actions/upload-artifact@v4
        with:
          name: CrystalOTC-Windows-Complete
          path: CrystalOTC-Windows/
          if-no-files-found: error
          retention-days: 7
